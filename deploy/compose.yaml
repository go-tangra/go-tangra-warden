# Development / integration stack for services/warden alone. Never use these
# credentials outside a workstation. The platform stack (services/gateway/deploy)
# also carries Vault and the warden database for end-to-end runs.
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: warden
    ports: ["5433:5432"]
    volumes: ["./init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro"]
  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--requirepass", "dev", "--user", "warden", "on", ">dev", "~*", "&*", "+@all"]
    ports: ["6380:6379"]
  vault:
    image: hashicorp/vault:1.18
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["8200:8200"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8026:8025", "1026:1025"]
